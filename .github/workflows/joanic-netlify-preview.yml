name: Joanic Netlify preview bundle

on:
  push:
    branches:
      - agent/joanic-staircase-project
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install image tools
        run: sudo apt-get update && sudo apt-get install -y webp imagemagick
      - name: Run canonical checks
        run: node tools/checks/run.mjs
      - name: Build preview bundle
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node tools/deploy/build-vps-bundle.mjs
      - name: Validate preview bundle
        run: node tools/deploy/validate-vps-bundle.mjs
      - name: Upload preview bundle
        uses: actions/upload-artifact@v4
        with:
          name: joanic-netlify-preview
          path: .deploy-dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
