name: Temporary branch regeneration

on:
  push:
    branches:
      - agent/mobile-home-corrections

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/mobile-home-corrections
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild generated projections
        run: node tools/checks/run.mjs

      - name: Commit generated files when needed
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "Generated projections are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "build(home): regenerate corrected public projections"
          git push origin HEAD:agent/mobile-home-corrections
