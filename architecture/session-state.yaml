vps_security:
  artifact: architecture/vps-security-plan.md
  caddy_admin:
    bind: 127.0.0.1:2019
    public_exposure_allowed: false
  response_headers:
    server_banner_removed: true
    x_content_type_options: nosniff
    referrer_policy: strict-origin-when-cross-origin
    x_frame_options: DENY
    hsts_enabled: false
    csp_enforced: false
  ssh_target:
    root_login: disabled
    password_authentication: disabled
    key_authentication: required
    preferred_network_access: private-vpn-or-management-network
  firewall:
    provider_firewall_preferred: true
    host_firewall_required: true
    caddy_admin_port_public: false
    deny_unused_inbound: true
  filesystem:
    releases_immutable_after_activation: true
    caddy_site_tree_write_access: false
    deploy_user_owns_release_activation: true
  ddos:
    host_firewall_is_not_sufficient_for_volumetric_attack: true
    upstream_protection_required: true
    edge_options:
      - provider-protected-direct-caddy
      - cloudflare-proxied-dns-restricted-origin
      - cloudflare-tunnel-private-ssh
  dns_and_registrar:
    mfa_required: true
    transfer_lock_required: true
    export_zone_before_cutover: true
    dnssec_recommended_when_supported: true

vps_bundle:
  builder: tools/deploy/build-vps-bundle.mjs
  validator: tools/deploy/validate-vps-bundle.mjs
  workflow: .github/workflows/vps-bundle-check.yml
