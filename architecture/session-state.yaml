coverage_decision:
  mode: complete-legacy-coverage
  required_content_media_count: 39
  curated_gallery_allowed: false
  studio_project_required: true
  allowed_exclusions:
    - logos
    - empty runtime placeholders
    - duplicate references to the same source asset
  rules:
    - every unique legacy content image must resolve to one Media record
    - every Media record must have truthful alt text and verified dimensions
    - project media must resolve to a Project
    - capability media must resolve to an explicit capability or service relationship
    - exclusions require a documented non-content or duplicate reason

route_invariants:
  - canonical origin comes from Site.canonicalOrigin
  - route paths and canonical URLs are unique
  - every project detail route resolves to one current Project
  - generated HTML is required before sitemap eligibility
  - eligible routes appear exactly once in sitemap.xml
  - blocked and deferred routes remain absent from generated output and sitemap.xml
  - gallery cannot be generated until all 39 legacy content images pass the coverage gate

constraints:
  - do not edit support.js
  - do not evolve the legacy runtime
  - do not bypass the Knowledge Repository
  - do not duplicate content between builders and tables
  - do not add dependencies unless the current platform cannot reasonably solve the problem
  - do not generate gallery while blocked
  - do not generate image detail routes while deferred
  - do not add sitemap URLs before generated HTML validation
  - do not replace complete coverage with a curated subset
  - do not silently exclude a real legacy content image

