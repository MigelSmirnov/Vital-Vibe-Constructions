cutover_plan:
  phase_a:
    name: ci-only-bundle-preparation
    production_change: false
    steps:
      - implement deterministic bundle builder
      - implement bundle validator
      - run bundle build in pull-request CI
      - inspect bundle route and asset inventory
      - manually confirm GitHub Pages source setting
      - manually confirm custom domain and HTTPS state
      - check historical URL behavior
  phase_b:
    name: production-capable-merge
    steps:
      - keep normal checks green
      - merge reviewed code to main when otherwise ready
      - keep canonical URLs unchanged during cutover
  phase_c:
    name: pages-source-switch
    steps:
      - set Pages source to GitHub Actions
      - enable production deploy job from main
  phase_d:
    name: production-verification
    steps:
      - verify eight canonical HTML routes over HTTPS
      - verify stylesheet and logo
      - verify generated media assets
      - verify robots sitemap and llms
      - verify canonical H1 navigation and mobile rendering
  phase_e:
    name: discovery-verification
    steps:
      - recheck sitemap in Search Console
      - inspect indexing of eight canonical routes
      - monitor old URL coverage and 404s
      - measure queries before Wave 1 expansion

rollback:
  preserve_legacy_root_files_until_stable: true
  preferred_action_if_cutover_fails:
    - switch Pages back to branch publishing
    - select main and root if confirmed as current source
    - verify legacy homepage
    - debug artifact deployment without editing legacy runtime

