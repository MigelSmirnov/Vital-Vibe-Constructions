current_strategy:
  legacy_runtime: read-only
  next_runtime: site-next
  source_of_truth: Knowledge Repository
  production_target: vps-caddy-static
  github_pages_target_status: fallback-only
  production_unchanged: true
  public_path_mode: root-relative
  application_attack_surface:
    cms: false
    database: false
    php_runtime: false
    node_runtime_on_server: false
    public_application_admin: false
  deployment_model:
    build_location: github-actions
    server_build_required: false
    artifact: vps-site-bundle.tgz
    bundle_directory: .deploy-dist
    server_root: /srv/vital-vibe/current
    release_root: /srv/vital-vibe/releases
    atomic_switch: symlink
    initial_deploy_mode: manual-artifact-upload
    automatic_ssh_deploy_enabled: false

vps_security:
  artifact: architecture/vps-security-plan.md
  caddy_admin:
    bind: 127.0.0.1:2019
    public_exposure_allowed: false
  response_headers:
    server_banner_removed: true
    x_content_type_options: nosniff
    referrer_policy: strict-origin-when-cross-origin
    x_frame_options: DENY
    permissions_policy:
      - camera-disabled
      - microphone-disabled
      - geolocation-disabled
    hsts_enabled: false
    hsts_reason: defer-until-https-cutover-and-rollback-proven
    csp_enforced: false
    csp_policy: audit-resources-and-test-report-only-before-enforcement
  ssh_target:
    root_login: disabled
    password_authentication: disabled
    key_authentication: required
    preferred_network_access: private-vpn-or-management-network
    fail2ban: optional-secondary-if-public-ssh
    secret_keys_in_repository: forbidden
  firewall:
    provider_firewall_preferred: true
    host_firewall_required: true
    caddy_admin_port_public: false
    deny_unused_inbound: true
  operating_system:
    supported_lts_required: true
    automatic_security_updates_required: true
    unused_services_should_be_removed: true
  filesystem:
    releases_immutable_after_activation: true
    caddy_site_tree_write_access: false
    deploy_user_owns_release_activation: true
  ddos:
    host_firewall_is_not_sufficient_for_volumetric_attack: true
    upstream_protection_required: true
    edge_options:
      - provider-protected-direct-caddy
      - cloudflare-proxied-dns-restricted-origin
      - cloudflare-tunnel-private-ssh
    strongest_practical_origin_isolation: cloudflare-tunnel-private-ssh
  dns_and_registrar:
    mfa_required: true
    transfer_lock_required: true
    export_zone_before_cutover: true
    dnssec_recommended_when_supported: true
    least_privilege_dns_tokens_if_automated: true

vps_bundle:
  builder: tools/deploy/build-vps-bundle.mjs
  validator: tools/deploy/validate-vps-bundle.mjs
  workflow: .github/workflows/vps-bundle-check.yml
  ignored_outputs:
    - .deploy-dist/
    - vps-site-bundle.tgz
  excludes:
    - legacy-root-index-html

vps_server:
  web_server: caddy
  caddy_template: deploy/vps/Caddyfile
  default_web_root: /srv/vital-vibe/current
  release_installer: deploy/vps/install-release.sh
  rollback_helper: deploy/vps/rollback-release.sh
  automatic_https_expected_for_direct-caddy-mode: true

