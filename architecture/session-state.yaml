active_stage:
  goal: Define a prioritized SEO/AEO query-to-page architecture for the highest-value Barcelona search and answer intents before adding more public routes.
  status: ready
  next_artifact: prioritized-query-page-matrix
  target_opportunity_count: 10-15
  matrix_fields:
    - primary_query_or_user_question
    - intent_class
    - proposed_canonical_route
    - target_entity_or_content_type
    - currently_available_evidence
    - missing_evidence_or_facts
    - related_projects
    - related_services
    - recommended_truthful_schema
    - internal_link_sources
    - internal_link_destinations
    - business_value
    - seo_aeo_priority
    - publication_readiness
  scope:
    - commercial service intent
    - local Barcelona intent
    - project and case-study evidence intent
    - pricing and budgeting questions
    - old-building renovation problems
    - electrical planning and renovation questions
    - kitchen and bathroom renovation questions
    - flooring and leveling questions
    - waterproofing and drainage questions
    - painting and masonry questions where first-party evidence exists
  exclusions:
    - do not create public routes before the matrix establishes priority and evidence readiness
    - do not invent search demand numbers without verified data
    - do not infer addresses, certifications, customer identities, private locations, material brands, dates, or unsupported technical facts
    - do not mass-produce near-duplicate service or city pages
    - do not edit support.js or legacy entrypoints

planned_execution:
  - stage: production-gate
    goal: Confirm the deployment approach for serving site-next as the public document root and verify routes, assets, sitemap, robots, canonical URLs, and production HTTPS behavior.
  - stage: service-expansion
    goal: Use the query/page matrix to choose and author the highest-value page-owned service records, expected to include some or all of kitchens, bathrooms, electrical, painting, and masonry.
  - stage: entity-local-layer
    goal: Strengthen factual Organization, WebSite, and appropriate local-business entity markup without inventing a public address or unsupported attributes.
  - stage: evidence-placement
    goal: Place existing project media next to technical claims where the current images already support those claims; add reserved El Raval technical media later when available.
  - stage: editorial-layer
    goal: Promote strong article-sandbox topics into modeled public content after article entities, route contracts, evidence rules, and builders are defined.
  - stage: internal-linking
    goal: Connect informational content to relevant services and evidence-rich projects and connect service pages back to documented projects and supporting guides.
  - stage: multilingual
    goal: Design crawlable English and Russian variants with hreflang only after Spanish coverage is strong.
  - stage: measurement
    goal: After production deployment, revise priorities using real indexing, query, impression, click, and conversion data rather than speculative demand.

