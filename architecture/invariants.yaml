version: 1
invariants:
  document:
    exactly_one_h1: true
    semantic_main_required: true
    crawlable_navigation_links_required: true
    primary_content_in_raw_html: true
  metadata:
    title_required: true
    description_required: true
    canonical_required: true
    structured_data_must_match_visible_content: true
  images:
    alt_attribute_required: true
    dimensions_required_for_content_images: true
    important_text_must_not_depend_on_ocr_only: true
  content:
    stable_id_required: true
    stable_slug_required_for_public_entities: true
    draft_content_must_not_be_publicly_indexed: true
  modules:
    generated_files_must_not_be_edited: true
    cross_module_imports_use_public_api: true
    circular_dependencies_forbidden: true
  external_apps:
    planner_url_centralized: true
    beta_status_visible: true
    navigation_must_work_without_javascript: true
