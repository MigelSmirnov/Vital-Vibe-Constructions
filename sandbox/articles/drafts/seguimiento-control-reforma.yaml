  "seo_title": "Cómo controlamos una reforma: avance, gastos y cambios",
  "meta_description": "Cómo registramos avance, pagos, compras y cambios durante una reforma para mantener una visión actualizada del proyecto y poder explicar su evolución.",
  "h1": "Cómo seguimos una reforma: avance, gastos y cambios sin perder el hilo",
  "introduction": "Una reforma cambia mientras avanza. Aparecen decisiones, compras reales, trabajos adicionales y ajustes de alcance. Nuestro objetivo es que esa evolución quede registrada y pueda entenderse después, sin depender de mensajes sueltos ni de la memoria.",
  "author": "Vital Vibe Construction",
