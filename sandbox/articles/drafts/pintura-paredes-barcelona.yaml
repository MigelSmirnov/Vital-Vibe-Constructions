  "h1": "Pintura de paredes: de qué depende el precio y por qué no basta con repintar",
  "introduction": "El precio de pintar paredes puede variar mucho. La diferencia casi nunca está solo en aplicar la pintura, sino en el estado del soporte, la protección del espacio y la preparación necesaria antes de empezar.",
