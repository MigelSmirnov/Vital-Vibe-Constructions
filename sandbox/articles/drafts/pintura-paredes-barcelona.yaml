  "sections": [
    {
      "heading": "Cuándo la pintura puede costar entre 4 y 6 €/m²",
      "blocks": [
        {
          "type": "paragraph",
          "text": "Un precio bajo, entre 4 y 6 €/m², solo es posible cuando las paredes ya están completamente preparadas. Es una situación habitual cuando realizamos una reforma integral y la superficie ya está nivelada, reparada, lijada y lista para el acabado."
        },
        {
          "type": "paragraph",
          "text": "En ese caso, con un solo color, la imprimación previa y la aplicación de pintura pueden situarse alrededor de 6 €/m². El precio incluye dos manos de pintura y el tiempo de secado necesario entre ambas."
        }
      ]
    },
    {
      "heading": "Actualizar una vivienda habitada es otro trabajo",
      "blocks": [
        {
          "type": "paragraph",
          "text": "Cuando el cliente quiere renovar las paredes de una vivienda en uso, el coste aumenta porque primero hay que proteger todo lo que no debe pintarse. Suelos, puertas, ventanas, muebles, cocina, enchufes e interruptores deben cubrirse con cartón, papel y plástico."
        },
        {
          "type": "paragraph",
          "text": "Según el tamaño de la vivienda, la cantidad de mobiliario y la complejidad del espacio, esta preparación puede ocupar desde un día hasta varios días."
        }
      ]
    },
    {
      "heading": "Antes de pintar hay que investigar el estado de la pared",
      "blocks": [
        {
          "type": "paragraph",
          "text": "Una grieta pequeña no siempre se soluciona con un poco de masilla y pintura. Puede coincidir con una junta de fábrica de ladrillo o aparecer en una zona reparada anteriormente que vuelve a abrirse."
        },
        {
          "type": "paragraph",
          "text": "Por eso conviene revisar la causa del defecto antes de taparlo. En algunos casos, una grieta aparentemente menor puede requerir una reparación más profunda para evitar que reaparezca."
        }
      ]
    },
    {
      "heading": "La pintura antigua también puede fallar",
      "blocks": [
        {
          "type": "paragraph",
          "text": "Si la pintura existente se desprende en algunas zonas, no se debe aplicar una capa nueva encima. El soporte tendrá que sanearse y, probablemente, volver a enlucirse o masillarse antes de pintar."
        },
        {
          "type": "quote",
          "text": "La pintura no oculta los defectos de la pared: normalmente los hace más visibles."
        },
        {
          "type": "list",
          "items": [
            "Ondulaciones y desniveles.",
            "Arañazos o golpes.",
            "Marcas de masilla.",
            "Zonas mal lijadas.",
            "Desconchados del revestimiento anterior."
          ]
        }
      ]
    },
    {
      "heading": "Si el revestimiento está sano",
      "blocks": [
        {
          "type": "paragraph",
          "text": "Cuando la pintura antigua está bien adherida, no presenta desprendimientos y la pared no tiene defectos importantes, el proceso es mucho más sencillo: se limpia la superficie, se aplica la imprimación adecuada y se pinta."
        }
      ]
    },
    {
      "heading": "Aplicamos dos manos de pintura",
      "blocks": [
        {
          "type": "paragraph",
          "text": "La pintura se aplica normalmente en dos capas. Entre la primera y la segunda se respeta el tiempo de secado indicado para que el color quede uniforme y el acabado alcance una buena resistencia."
        },
        {
          "type": "paragraph",
          "text": "Las dos manos y el tiempo de espera entre capas están incluidos en el precio por metro cuadrado indicado para paredes ya preparadas."
        }
      ]
    },
    {
      "heading": "Pintar con pistola exige proteger muy bien el espacio",
      "blocks": [
        {
          "type": "paragraph",
          "text": "Trabajamos habitualmente con pistola de pintura porque permite conseguir una superficie uniforme y sin marcas de rodillo. Sin embargo, durante la pulverización se forma en el aire una niebla fina de pintura."
        },
        {
          "type": "paragraph",
          "text": "Si el espacio no está bien protegido, esas partículas pueden depositarse sobre ventanas, puertas, suelos, muebles y otras superficies. Por eso el encintado y la protección forman parte esencial del trabajo."
        }
      ]
    },
    {
      "heading": "La pistola no es la mejor opción en todas las viviendas",
      "blocks": [
        {
          "type": "paragraph",
          "text": "No todas las viviendas deben pintarse con pistola. En un piso vacío o dentro de una reforma integral suele ser una solución muy eficaz, pero en una vivienda amueblada o con una distribución compleja la preparación puede resultar desproporcionada."
        },
        {
          "type": "paragraph",
          "text": "La elección entre pistola y rodillo se realiza después de revisar cada caso. Lo importante no es utilizar siempre la misma herramienta, sino escoger el método que permita obtener el mejor resultado en ese espacio concreto."
        }
      ]
    },
    {
      "heading": "Qué factores influyen en el precio final",
      "blocks": [
        {
          "type": "list",
          "items": [
            "El estado real de las paredes.",
            "La necesidad de reparar grietas o zonas desprendidas.",
            "La cantidad de elementos que deben protegerse.",
            "El número de colores y cambios de tono.",
            "El método de aplicación más adecuado.",
            "La accesibilidad y la complejidad de la vivienda."
          ]
        },
        {
          "type": "paragraph",
          "text": "Por este motivo, el precio definitivo solo puede confirmarse después de revisar el inmueble y definir con claridad el alcance de la preparación."
        }
      ]
    }
  ],
  "faq": [
    {
      "question": "¿El precio de 6 €/m² incluye dos manos?",
      "answer": "Sí, cuando las paredes ya están preparadas y se pinta en un solo color, el precio orientativo incluye la imprimación previa, dos manos y el tiempo de secado entre capas."
    },
    {
      "question": "¿La pintura puede ocultar grietas o irregularidades?",
      "answer": "No. La pintura no corrige el soporte y suele remarcar las irregularidades, especialmente con determinadas luces y acabados."
    },
    {
      "question": "¿Siempre se pinta con pistola?",
      "answer": "No. La técnica se elige según el estado, la distribución y el uso de la vivienda. En algunos casos el rodillo es una opción más adecuada."
