    "El pavimento final fue elegido por el cliente: TILO Trend Marcanto Oak Natur L1278. No publicar manufacturer_article hasta resolver la discrepancia entre Cabinet Stage 3 (100024203) y la ficha actual de Parmovil para L1278 (100011301).",
    "La medición de cotas se hizo antes, dentro del levantamiento general de la reforma integral; no forma parte de los tres días de ejecución.",
    "Enlazar a la guía técnica existente sobre nivelación de suelos en vez de duplicar su explicación.",
    "Las cifras de materiales proceden de facturas del proyecto en Cabinet_web. Mantener separadas las cifras reales de cualquier orientación comercial.",
