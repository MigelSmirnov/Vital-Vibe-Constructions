          "type": "paragraph",
          "text": "Después de preparar la base, el cliente eligió para esta vivienda el parquet multicapa TILO Trend Marcanto Oak Natur L1278. Indicamos la marca y el modelo porque forman parte de este caso real, no como recomendación comercial."
        },
        {
          "type": "paragraph",
          "text": "Para el proyecto se encargaron 20 cajas, equivalentes a 46,56 m², para una superficie de instalación estimada de unos 40 m². La diferencia deja margen para cortes, selección de tablas y reserva durante el montaje."
        },
