      "heading": "Definir qué debe cambiar",
      "blocks": [
        {
          "type": "paragraph",
          "text": "El primer paso no es elegir acabados, sino decidir si la reforma será estética o si también afectará a la distribución, la electricidad, la fontanería y la ventilación. Esta diferencia condiciona el presupuesto, la duración y el orden de los trabajos."
        },
