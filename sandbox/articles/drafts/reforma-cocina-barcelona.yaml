            "Definir si se renovarán instalaciones eléctricas y de agua.",
            "Separar elementos imprescindibles de mejoras opcionales."
          ]
        }
      ]
    },
    {
      "heading": "Revisar la distribución antes de comprar",
      "blocks": [
        {
          "type": "paragraph",
          "text": "Los muebles y electrodomésticos deben responder a una distribución viable. Antes de comprar conviene confirmar medidas, recorridos de puertas, zonas de paso y puntos de conexión."
        },
        {
          "type": "quote",
          "text": "Una decisión temprana sobre la distribución evita adaptar la obra a productos comprados sin comprobar su encaje."
        }
      ]
    },
    {
      "heading": "Coordinar instalaciones y acabados",
      "blocks": [
        {
          "type": "paragraph",
          "text": "La cocina reúne varios oficios en poco espacio. Electricidad, agua, revestimientos, mobiliario, encimera, pintura e iluminación deben coordinarse para que cada fase deje preparado el trabajo de la siguiente."
        }
      ]
    },
    {
      "heading": "Preparar la información para pedir presupuesto",
      "blocks": [
        {
          "type": "paragraph",
          "text": "Para recibir una propuesta útil es recomendable aportar medidas, fotografías del estado actual y una lista breve de objetivos. Cuando todavía existen decisiones abiertas, deben identificarse como tales en lugar de sustituirlas por supuestos."
        }
      ]
    }
