    "Resultado de la intervención. Fotografía retocada previamente con IA; las fotografías de obra se conservan sin retoque.": {
      "en": "Result of the work. This photograph was previously retouched using AI; the construction photographs remain unretouched.",
      "ru": "Результат работ. Эта фотография ранее была отретуширована с помощью ИИ; фотографии процесса работ сохранены без ретуши."
