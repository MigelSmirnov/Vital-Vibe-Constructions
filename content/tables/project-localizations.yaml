    "El lavabo estaba en la pared destinada al nuevo toallero. Al retirarlo quedaban a la vista la salida eléctrica del espejo y los orificios de las fijaciones; había que recuperar el acabado.": {
      "en": "The basin was on the wall intended for the new towel rail. Removing it exposed the mirror's electrical outlet and fixing holes, so the finish had to be restored.",
      "ru": "Раковина находилась на стене, предназначенной для нового полотенцесушителя. После её снятия оставались видны электрический вывод для зеркала и крепёжные отверстия — отделку нужно было восстановить."
    },
    "Trasladar el lavabo a la pared derecha y añadir un toallero en su antigua ubicación, adaptando las conexiones y recuperando la parte afectada del revestimiento.": {
      "en": "Move the basin to the right-hand wall and add a towel rail in its former position, adapting the connections and restoring the affected wall covering.",
      "ru": "Перенести раковину на правую стену и установить полотенцесушитель на её прежнем месте, адаптировав подключения и восстановив затронутую часть облицовки."
    },
    "Modificar las tomas de agua y el desagüe para la nueva posición del lavabo.": {
      "en": "Modify the water supply and drainage connections for the basin's new position.",
      "ru": "Переделать водоснабжение и слив под новое положение раковины."
    },
    "Reubicar el sensor de fugas, la toma eléctrica del toallero y la salida para el espejo.": {
      "en": "Relocate the leak sensor, the towel rail's electrical socket and the mirror connection.",
      "ru": "Перенести датчик протечки, розетку для полотенцесушителя и вывод для зеркала."
    },
    "Mantener la altura de la salida eléctrica del espejo en la nueva pared exigió retirar dos filas adicionales de azulejos por encima del lavabo.": {
      "en": "Keeping the mirror's electrical connection at the same height on the new wall required removing two additional rows of tiles above the basin.",
      "ru": "Чтобы сохранить высоту электрического вывода для зеркала на новой стене, пришлось снять два дополнительных ряда плитки над раковиной."
    },
    "Traslado del sensor de fugas, la toma eléctrica del toallero y la salida prevista para el espejo.": {
      "en": "Relocation of the leak sensor, the towel rail's electrical socket and the planned mirror connection.",
      "ru": "Перенос датчика протечки, розетки полотенцесушителя и вывода для зеркала."
    },
    "Adaptación de las tomas de agua y del desagüe dentro de la pared abierta antes de cerrar el tabique.": {
      "en": "Adaptation of the water supply and drainage inside the opened wall before closing the partition.",
      "ru": "Переделка водоснабжения и слива внутри вскрытой стены до закрытия перегородки."
    },
    "Retirada del alicatado en las paredes afectadas, incluidas dos filas adicionales para conservar la altura de la salida del espejo.": {
      "en": "Removal of tiles from the affected walls, including two extra rows to retain the mirror connection height.",
      "ru": "Снятие плитки на затронутых стенах, включая два дополнительных ряда для сохранения высоты вывода зеркала."
    },
