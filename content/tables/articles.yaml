          ],
          "heading": "Si el revestimiento está sano"
        },
        {
          "blocks": [
            {
              "text": "La pintura se aplica normalmente en dos capas. Entre la primera y la segunda se respeta el tiempo de secado indicado para que el color quede uniforme y el acabado alcance una buena resistencia.",
              "type": "paragraph"
            },
            {
              "text": "Las dos manos y el tiempo de espera entre capas están incluidos en el precio por metro cuadrado indicado para paredes ya preparadas.",
              "type": "paragraph"
            }
          ],
          "heading": "Aplicamos dos manos de pintura"
        },
        {
          "blocks": [
            {
              "text": "Trabajamos habitualmente con pistola de pintura porque permite conseguir una superficie uniforme y sin marcas de rodillo. Sin embargo, durante la pulverización se forma en el aire una niebla fina de pintura.",
              "type": "paragraph"
            },
            {
              "text": "Si el espacio no está bien protegido, esas partículas pueden depositarse sobre ventanas, puertas, suelos, muebles y otras superficies. Por eso el encintado y la protección forman parte esencial del trabajo.",
              "type": "paragraph"
            }
          ],
          "heading": "Pintar con pistola exige proteger muy bien el espacio"
        },
        {
          "blocks": [
            {
              "text": "No todas las viviendas deben pintarse con pistola. En un piso vacío o dentro de una reforma integral suele ser una solución muy eficaz, pero en una vivienda amueblada o con una distribución compleja la preparación puede resultar desproporcionada.",
              "type": "paragraph"
            },
            {
              "text": "La elección entre pistola y rodillo se realiza después de revisar cada caso. Lo importante no es utilizar siempre la misma herramienta, sino escoger el método que permita obtener el mejor resultado en ese espacio concreto.",
              "type": "paragraph"
