          "category": "Floors and parquet",
          "meta_description": "A real floor preparation and parquet project in Barcelona: heights, local demolition, self-levelling mortar, installation and documented costs.",
          "summary": "Before laying the new flooring in this full renovation, we had to resolve the geometry of the existing floor. The job involved more than simply pouring self-levelling mortar: we measured the heights, identified the high spots, chose a workable finished floor height and corrected the base by area.",
