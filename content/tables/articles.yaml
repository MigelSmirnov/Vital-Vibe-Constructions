                  "type": "image"
                },
                {
                  "text": "We review the substrate before finishing. Where coating is loose, the estimate needs to include removal and repair before painting. Covering the visible line does not necessarily describe all the work required.",
                  "type": "paragraph"
                }
              ],
              "heading": "A small crack can change the scope"
