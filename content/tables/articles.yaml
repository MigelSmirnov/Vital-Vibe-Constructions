                },
                {
                  "type": "paragraph",
                  "text": "The plant room brings together pipes, pumps, valves, instruments and controls. An exterior photograph is not enough to reconstruct the entire circuit: the pipework, schematic and controls must also be checked."
                },
                {
                  "type": "image",
                  "media_id": "media-solar-collector-plant-room",
                  "alt": "Pipes, pumps, distribution manifolds and control equipment in a plant room",
                  "caption": "Part of the hydraulic and control installation in the plant room."
                }
              ]
            },
            {
              "heading": "Appearance alone does not answer the question",
              "blocks": [
                {
                  "type": "paragraph",
                  "text": "Two collectors that look alike can have different internal flow paths. Connections on the same side may therefore be correct for one model but not the intended arrangement for another."
