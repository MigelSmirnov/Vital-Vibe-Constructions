      "seo_title": "Conexión de un colector solar: un lado o diagonal",
      "summary": "Una conexión por el mismo lado no demuestra por sí sola un error. La respuesta depende del circuito hidráulico interno, el número de captadores y la documentación del fabricante.",
      "meta_description": "Cómo comprobar la conexión de un colector solar térmico: esquema por un lado o diagonal, posición de la sonda y límites indicados por el fabricante.",
