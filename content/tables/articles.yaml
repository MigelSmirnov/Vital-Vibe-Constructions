        {
          "blocks": [
            {
              "text": "¿El precio de 6 €/m² incluye dos manos? Sí, cuando las paredes ya están preparadas y se pinta en un solo color, el precio orientativo incluye la imprimación previa, dos manos y el tiempo de secado entre capas. Se trata de mano de obra: los materiales se pagan aparte.",
