      "translations": {
        "en": {
          "body": [
            {
              "blocks": [
                {
                  "text": "One of the most common questions we hear is:",
                  "type": "paragraph"
                },
                {
                  "text": "“How much will renovating the apartment cost?”",
                  "type": "paragraph"
                },
                {
                  "text": "Unfortunately, that question cannot be answered honestly based on floor area alone.",
                  "type": "paragraph"
                },
                {
                  "text": "In Barcelona, most properties we work on belong to the older housing stock. Built decades ago, they have very different structural characteristics. That is why renovation costs for two apartments of the same size can differ by tens of percentage points.",
                  "type": "paragraph"
                },
                {
                  "text": "Before preparing an estimate, we assess not only the floor area but also the floors, walls, building services, demolition needed and the particular features of the building.",
                  "type": "paragraph"
                }
              ],
              "heading": "Why we cannot quote a price over the phone"
            },
            {
              "blocks": [
                {
                  "text": "For a complete apartment renovation in Barcelona, the minimum cost usually starts at approximately €800/m².",
                  "type": "paragraph"
                },
                {
                  "text": "That reference is possible when demolition is already complete and the apartment is ready for construction work to begin.",
                  "type": "paragraph"
                },
                {
                  "text": "If all the old finishes need removing, the cost usually increases by approximately €50/m².",
                  "type": "paragraph"
                },
                {
                  "text": "It is important to understand that this is an indicative figure. The final estimate is prepared only after inspecting the property.",
                  "type": "paragraph"
                }
              ],
              "heading": "Where the cost of a complete renovation usually starts"
            },
            {
              "blocks": [
                {
                  "text": "Many people believe renovation cost depends only on floor area.",
                  "type": "paragraph"
                },
                {
                  "text": "In practice, it is far from that simple.",
                  "type": "paragraph"
                },
                {
                  "text": "For example, two 80 m² apartments can have completely different renovation costs.",
                  "type": "paragraph"
                },
                {
                  "text": "The reason is straightforward: in Barcelona's older housing stock, practically every property has its own particular features.",
                  "type": "paragraph"
                },
                {
                  "text": "These may include:",
                  "type": "paragraph"
                },
                {
                  "items": [
                    "Timber floor beams.",
                    "Brick vaults.",
                    "Significant differences in floor level.",
                    "Old electrical wiring.",
                    "Old pipes.",
                    "The consequences of several previous renovations."
                  ],
                  "type": "list"
                },
                {
                  "text": "These are the features that determine the real cost of the work.",
                  "type": "paragraph"
                }
              ],
              "heading": "Why apartments of the same size cost different amounts"
            },
            {
              "blocks": [
                {
                  "text": "One of the first things we look at when inspecting an apartment is the floor.",
                  "type": "paragraph"
                },
                {
                  "text": "Most apartments in Barcelona's older housing stock were built on timber beams with brick vaults. Over decades of use, the structure gradually changes geometry, so a perfectly level floor is a rare find.",
                  "type": "paragraph"
                },
                {
                  "text": "We regularly encounter properties where:",
                  "type": "paragraph"
                },
                {
                  "items": [
                    "The floor has a noticeable slope.",
                    "The surface resembles a shallow boat.",
                    "The level difference reaches several centimetres within one room.",
                    "Sometimes the whole apartment slopes."
                  ],
                  "type": "list"
                },
                {
                  "text": "While the apartment is empty, many owners do not even notice.",
                  "type": "paragraph"
                },
                {
                  "text": "But once the renovation is complete, the consequences of an uneven base become visible.",
                  "type": "paragraph"
                },
                {
                  "text": "On one of our jobs, the level difference was around 14 cm over 10 metres. The first photograph shows leveling in progress; the next shows the same property after the floor covering and skirting were installed.",
                  "type": "paragraph"
                },
                {
                  "alt": "Floor leveling in progress with a visible laser line",
                  "caption": "Floor leveling in progress with a visible laser line",
                  "media_id": "media-floor-work",
                  "type": "image"
                },
                {
                  "alt": "Floor covering and skirting installed in the first property's corridor",
                  "caption": "Floor covering and skirting installed in the first property's corridor",
                  "media_id": "media-floor-finish",
                  "type": "image"
                }
              ],
              "heading": "The floor is one of the most important parts of a renovation"
            },
            {
              "blocks": [
                {
                  "text": "Clients quite often say:",
                  "type": "paragraph"
                },
                {
                  "text": "“Let's just put down PVC.”",
                  "type": "paragraph"
                },
                {
                  "text": "Or:",
                  "type": "paragraph"
                },
                {
                  "text": "“We can lay laminate straight away.”",
                  "type": "paragraph"
                },
                {
                  "text": "That option does indeed look cheaper.",
                  "type": "paragraph"
                },
                {
                  "text": "But any new covering follows the geometry of the existing floor.",
                  "type": "paragraph"
                },
                {
                  "text": "Once furniture is installed, problems begin to appear:",
                  "type": "paragraph"
                },
                {
                  "items": [
                    "Noticeable gaps appear between the floor and skirting.",
                    "Furniture needs adjusting.",
                    "Built-in wardrobes become much more difficult to install."
                  ],
                  "type": "list"
                },
                {
                  "text": "Sometimes the gap between the new skirting and the floor is so large that a finger fits underneath.",
                  "type": "paragraph"
                },
                {
                  "text": "That is why we recommend preparing the base first.",
                  "type": "paragraph"
                },
                {
                  "text": "Below is a real job where we worked as the floor-installation contractor. Before starting, we recommended leveling the base, but our team did not make the decision about that preparation. The consequences are clearly visible in the photographs.",
                  "type": "paragraph"
                },
                {
                  "alt": "Overview of a room with floor covering and skirting installed",
                  "caption": "Overview of a room with floor covering and skirting installed",
                  "media_id": "media-floor-overview",
                  "type": "image"
                },
                {
                  "alt": "Close-up of the gap beneath the skirting, indicated with a tool",
                  "caption": "Close-up of the gap beneath the skirting, indicated with a tool",
                  "media_id": "media-floor-gap",
                  "type": "image"
                }
              ],
              "heading": "Why you cannot simply install a new covering"
            },
            {
              "blocks": [
                {
                  "text": "We believe a good renovation starts with preparing the base, not choosing the floor covering.",
                  "type": "paragraph"
                },
                {
                  "text": "Of course, a conventional heavy screed is not always possible in Barcelona's older buildings.",
                  "type": "paragraph"
                },
                {
                  "text": "That is why we use solutions that reduce the total weight of the construction.",
                  "type": "paragraph"
                },
                {
                  "text": "For example, depending on the situation, a lightweight leveling system using special mixes may be appropriate. Where possible, a separating or insulating layer is also installed to help reduce the risk of cracking.",
                  "type": "paragraph"
                },
                {
                  "text": "Every apartment needs its own solution.",
                  "type": "paragraph"
                },
                {
                  "text": "At another property we applied a thin self-leveling layer. The following photographs show the application and the surface immediately after spreading.",
                  "type": "paragraph"
                },
                {
                  "alt": "A thin self-leveling layer being applied at another property",
                  "caption": "A thin self-leveling layer being applied at another property",
                  "media_id": "media-floor-thin-work",
                  "type": "image"
                },
                {
                  "alt": "Surface freshly covered with self-leveling compound",
                  "caption": "Surface freshly covered with self-leveling compound",
                  "media_id": "media-floor-thin-finish",
                  "type": "image"
                }
              ],
              "heading": "Why the screed is the foundation of a good renovation"
            },
            {
              "blocks": [
                {
                  "text": "Sometimes clients suggest leaving the old tiles in place and leveling directly over them.",
                  "type": "paragraph"
                },
                {
                  "text": "We almost always turn down that approach.",
                  "type": "paragraph"
                },
                {
                  "text": "There are two reasons.",
                  "type": "paragraph"
                }
              ],
              "heading": "Why we do not pour over old tiles"
            },
            {
              "blocks": [
                {
                  "text": "In older apartments, existing tiles are not always as firmly bonded as they appear.",
                  "type": "paragraph"
                },
                {
                  "text": "Over years of use, the floor can change geometry and some tiles gradually lose their bond to the adhesive. This may be completely invisible from the surface.",
                  "type": "paragraph"
                },
                {
                  "text": "If a new screed is laid over that base, the entire new construction will depend on the strength of the old tiles.",
                  "type": "paragraph"
                },
                {
                  "text": "If those tiles subsequently come loose, the new leveling layer will lose its support as well.",
                  "type": "paragraph"
                },
                {
                  "text": "That is why we prefer to establish a reliable base first, then carry out the subsequent work.",
                  "type": "paragraph"
                }
              ],
              "heading": "First reason: the condition of the old base"
            },
            {
              "blocks": [
                {
                  "text": "Most older buildings in Barcelona were built with timber beams and brick vaults.",
                  "type": "paragraph"
                },
                {
                  "text": "Every additional layer increases the total weight of the construction.",
                  "type": "paragraph"
                },
                {
                  "text": "We aim for the most reliable result with the smallest possible additional load on the existing floor structure.",
                  "type": "paragraph"
                }
              ],
              "heading": "Second reason: additional load"
            },
            {
              "blocks": [
                {
                  "text": "We do not believe it is always necessary to choose the most expensive materials.",
                  "type": "paragraph"
                },
                {
                  "text": "Sometimes the budget can be reduced without a significant loss of quality.",
                  "type": "paragraph"
                },
                {
                  "text": "For example, if differences in floor level are minimal, a simpler solution can be selected to suit the particular covering.",
                  "type": "paragraph"
                },
                {
                  "text": "In lightly used rooms, an inexpensive laminate may sometimes be acceptable.",
                  "type": "paragraph"
                },
                {
                  "text": "However, in many cases we recommend considering modern PVC floor coverings.",
                  "type": "paragraph"
                },
                {
                  "text": "Despite the higher cost of the material itself, the difference in the total renovation cost is much smaller than many people expect. PVC also copes better with everyday use and lasts considerably longer.",
                  "type": "paragraph"
                }
              ],
              "heading": "Where you really can save"
            },
            {
              "blocks": [
                {
                  "text": "The cost of renovating an apartment in Barcelona is not determined by floor area alone.",
                  "type": "paragraph"
                },
                {
                  "text": "The condition of the property, the quality of the base, building services and the characteristics of older buildings all affect the price.",
                  "type": "paragraph"
                },
                {
                  "text": "That is why we never give a final price over the phone alone.",
                  "type": "paragraph"
                },
                {
                  "text": "We assess more than what is visible at the first inspection.",
                  "type": "paragraph"
                },
                {
                  "text": "We assess the base on which the entire future renovation will rest.",
                  "type": "paragraph"
                },
                {
                  "text": "Only then can we prepare the most accurate estimate possible and avoid unpleasant surprises during the work.",
                  "type": "paragraph"
                }
              ],
              "heading": "Conclusion"
            }
          ],
          "category": "Renovation · Cost and preparation",
          "meta_description": "Apartment renovation costs in Barcelona: older buildings, base preparation, floor leveling and choice of covering. Lessons from our work.",
          "seo_title": "Apartment renovation costs in Barcelona in 2026",
