                  "text": "The condition of the existing paint also matters: loose areas and outstanding repairs are identified before the finish is specified.",
                  "type": "paragraph"
                }
              ],
              "heading": "An occupied home needs protection"
            },
            {
              "blocks": [
                {
                  "text": "We use spray equipment where it suits the space and the work. Spraying requires protecting surfaces that must not receive paint. In a furnished home or around numerous details, a roller may be more convenient.",
