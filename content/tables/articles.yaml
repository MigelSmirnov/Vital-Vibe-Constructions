        {
          "blocks": [
            {
              "text": "Cuando la pintura antigua está bien adherida, no presenta desprendimientos y la pared no tiene defectos importantes, el proceso es mucho más sencillo: se limpia la superficie, se aplica la imprimación adecuada y se pinta.",
              "type": "paragraph"
