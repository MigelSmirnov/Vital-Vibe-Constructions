                {
                  "type": "paragraph",
                  "text": "There was also a practical limit to demolition. In some areas we removed approximately 3 cm of the existing floor construction, yet the thickness available to rebuild the base was still around 1 cm. Lowering the entire home to the exact landing level would have required a much deeper intervention."
