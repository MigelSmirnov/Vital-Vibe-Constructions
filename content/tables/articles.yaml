      "seo_title": "Mover un lavabo: desmontar y volver a montar el baño",
      "slug": "traslado-lavabo-toallero",
      "status": "published",
      "summary": "En un baño terminado, cualquier cambio afecta a más cosas de las que parece. Se puede retirar el lavabo, pero en la pared quedan fijaciones, tuberías y la salida eléctrica del espejo. Y en la nueva ubicación hay que preparar de nuevo todas esas conexiones.",
      "title": "Mover un lavabo significa desmontar y volver a montar el baño",
      "translations": {
        "en": {
          "body": [
            {
              "blocks": [
                {
                  "text": "The brief for this bathroom in Badalona was specific: move the basin to the right-hand wall and install a heated towel rail where it used to be.",
                  "type": "paragraph"
                },
                {
                  "items": [
                    "Location: Badalona.",
                    "Four working days.",
                    "€1,100 for labour, including rubble removal."
                  ],
                  "type": "list"
                }
              ],
              "heading": "The change we needed to make"
            },
            {
              "blocks": [
                {
                  "text": "The old wall still had the electrical outlet for the mirror and holes from the fixings. Once the basin moved, those marks would be exposed, so the finish needed to be restored.",
                  "type": "paragraph"
                },
                {
                  "text": "The electrical outlet for the mirror also had to move to the new wall at the same height. Opening just the area around the pipes was not enough: we had to remove two additional rows of tiles above the basin. Moving a single item meant more work on the walls than it might have seemed at first.",
                  "type": "paragraph"
                },
                {
                  "text": "We also needed to adapt the water and waste connections, relocate the leak sensor and prepare the socket for the heated towel rail. Each stage depended on the next: open the walls, move the connections, close them up and tile again.",
                  "type": "paragraph"
                }
              ],
              "heading": "What moving the basin involved"
            },
            {
              "blocks": [
                {
                  "text": "Removing the tiles in the affected areas exposed the inside of the partition and the services. The work photos show this stage: the wall open, pipes accessible and the tiling removed.",
                  "type": "paragraph"
                },
                {
                  "alt": "Water and waste pipes visible inside the open bathroom partition",
                  "caption": "Relocating the services before closing the partition.",
                  "media_id": "media-bathroom-sink-relocation-open-wall-utilities",
                  "type": "image"
                },
                {
                  "text": "This was where we carried out the part of the move that would later be hidden. Once the connections were adapted, we reinstated the plasterboard backing. The bathroom began to take shape again, with the connection points in their new positions.",
                  "type": "paragraph"
                },
                {
                  "alt": "Plasterboard backing visible on the right-hand bathroom wall during the work",
                  "caption": "Reinstating the wall backing before retiling.",
                  "media_id": "media-bathroom-sink-relocation-wallboard-wide",
                  "type": "image"
                },
                {
                  "alt": "Another view of the plasterboard backing and service outlets",
                  "caption": "The prepared backing and connection points from another angle.",
                  "media_id": "media-bathroom-sink-relocation-wallboard-detail",
                  "type": "image"
                }
              ],
              "heading": "What we had to open up to move the basin"
            },
            {
              "blocks": [
                {
                  "text": "After moving the services, we replaced the tiles in the areas we had opened up. Both parts of the job needed to be addressed: preparing the connections in the new position and removing the traces of the old one.",
                  "type": "paragraph"
                },
                {
                  "alt": "Corner of the retiled bathroom walls with water and electrical outlets exposed",
                  "caption": "Tiling restored before the final installation of the fittings.",
                  "media_id": "media-bathroom-sink-relocation-tiling-corner",
                  "type": "image"
                },
                {
                  "alt": "Retiled right-hand bathroom wall with water, waste and mirror electrical connections",
                  "caption": "Connection points on the right-hand wall after retiling.",
                  "media_id": "media-bathroom-sink-relocation-tiling-wall",
                  "type": "image"
                },
                {
                  "text": "In these photos, the walls are tiled and the outlets are ready. The final fitting was still to come. The basin ended up on the right-hand wall, with the heated towel rail on the wall it had occupied before.",
                  "type": "paragraph"
                },
                {
                  "alt": "Finished bathroom with a glass shower screen, wall-hung basin and illuminated mirror",
                  "caption": "The finished work. The homepage photograph was previously retouched with AI; the work-in-progress photographs are unretouched.",
                  "media_id": "media-home-bathroom",
                  "type": "image"
                }
              ],
              "heading": "Restoring the finished walls"
            },
            {
              "blocks": [
                {
                  "text": "Even this localised alteration produced almost a full bulk bag of rubble. Removing it was included in the €1,100 labour charge.",
                  "type": "paragraph"
                },
                {
                  "text": "The whole job took four working days. This amount covers the labour for this particular job, excluding the cost of materials.",
                  "type": "paragraph"
                },
                {
                  "text": "In the finished bathroom, you see the basin in its new position, the heated towel rail and the restored walls. The process photos show how much work went into that small change.",
                  "type": "paragraph"
                }
              ],
              "heading": "Four days of work and almost a full bulk bag of rubble"
            }
          ],
          "category": "Project story · Bathrooms",
          "meta_description": "A bathroom alteration in Badalona: moving the basin, adding a heated towel rail and restoring the walls. Four days and €1,100 for labour with rubble removal.",
          "seo_title": "Moving a basin: taking a bathroom apart and rebuilding it",
          "slug": "moving-a-bathroom-basin",
          "summary": "In a finished bathroom, a change can affect more than you expect. You can take the basin off the wall, but the fixings, pipes and electrical outlet for the mirror remain. All those connections then need to be prepared in the new position.",
          "title": "Moving a basin means taking the bathroom apart and putting it back together"
        },
        "ru": {
          "body": [
            {
              "blocks": [
                {
                  "text": "В этой ванной в Бадалоне задача была конкретной: перенести раковину на правую стену, а на её прежнем месте установить полотенцесушитель.",
                  "type": "paragraph"
                },
                {
                  "items": [
                    "Место работ: Badalona.",
                    "Четыре рабочих дня.",
                    "1100 € за работу, включая вынос строительного мусора."
                  ],
                  "type": "list"
                }
              ],
              "heading": "Что нужно было изменить"
            },
            {
              "blocks": [
                {
                  "text": "На прежней стене оставались электрический вывод под зеркало и отверстия от креплений. После переноса раковины они оказались бы на виду — отделку нужно было восстановить.",
                  "type": "paragraph"
                },
                {
                  "text": "При этом вывод под зеркало требовалось перенести на новую стену, сохранив его высоту. Поэтому вскрыть только участок возле труб было недостаточно: пришлось дополнительно снять ещё два ряда плитки над раковиной. Так перенос одного предмета потянул за собой больший объём работ со стенами, чем могло показаться вначале.",
                  "type": "paragraph"
                },
                {
                  "text": "Также предстояло перенести выводы воды и канализации, датчик протечки и подготовить розетку для полотенцесушителя. Каждый этап был связан со следующим: открыть стены, перенести коммуникации, закрыть и снова облицевать.",
                  "type": "paragraph"
                }
              ],
              "heading": "Что потянул за собой перенос"
            },
            {
              "blocks": [
                {
                  "text": "После снятия плитки на затронутых участках открылись внутренняя часть перегородки и коммуникации. На рабочих фотографиях показан именно этот этап: стена открыта, трубы доступны, облицовка разобрана.",
                  "type": "paragraph"
                },
                {
                  "alt": "Трубы водоснабжения и канализации внутри открытой перегородки ванной",
                  "caption": "Перенос коммуникаций перед закрытием перегородки.",
                  "media_id": "media-bathroom-sink-relocation-open-wall-utilities",
                  "type": "image"
                },
                {
                  "text": "Здесь выполнили ту часть переноса, которая после завершения останется скрытой. Затем восстановили гипсокартонное основание. Ванная постепенно начала приобретать прежний вид, уже с новым расположением выводов.",
                  "type": "paragraph"
                },
                {
                  "alt": "Гипсокартонное основание на правой стене ванной в процессе работ",
                  "caption": "Восстановление основания стены перед укладкой плитки.",
                  "media_id": "media-bathroom-sink-relocation-wallboard-wide",
                  "type": "image"
                },
                {
                  "alt": "Другой ракурс гипсокартонного основания и выводов коммуникаций",
                  "caption": "Подготовленное основание и выводы коммуникаций с другого ракурса.",
                  "media_id": "media-bathroom-sink-relocation-wallboard-detail",
                  "type": "image"
                }
              ],
              "heading": "Что пришлось вскрыть ради переноса раковины"
            },
            {
              "blocks": [
                {
                  "text": "После переноса коммуникаций восстановили плитку на вскрытых участках. Важно было решить обе части задачи: подготовить подключения на новом месте и убрать следы прежнего расположения раковины.",
                  "type": "paragraph"
                },
                {
                  "alt": "Угол облицованных стен ванной с открытыми выводами воды и электричества",
                  "caption": "Восстановленная облицовка перед окончательным монтажом оборудования.",
                  "media_id": "media-bathroom-sink-relocation-tiling-corner",
                  "type": "image"
                },
                {
                  "alt": "Правая стена ванной после укладки плитки с выводами воды, канализации и электричества под зеркало",
                  "caption": "Точки подключения на правой стене после восстановления отделки.",
                  "media_id": "media-bathroom-sink-relocation-tiling-wall",
                  "type": "image"
                },
                {
                  "text": "На этих фотографиях стены уже облицованы, а выводы подготовлены. Оставался окончательный монтаж. Раковина заняла место на правой стене, а на её прежней стене появился полотенцесушитель.",
                  "type": "paragraph"
                },
                {
                  "alt": "Готовая ванная со стеклянной душевой перегородкой, подвесной раковиной и зеркалом с подсветкой",
                  "caption": "Результат работ. Фотография с главной страницы ранее ретушировалась с помощью ИИ; рабочие фотографии сохранены без ретуши.",
                  "media_id": "media-home-bathroom",
                  "type": "image"
                }
              ],
              "heading": "Вернуть стенам законченный вид"
            },
            {
              "blocks": [
                {
                  "text": "Даже такая локальная переделка дала почти целый бигбэг строительного мусора. Его вынос вошёл в стоимость работы — 1100 €.",
                  "type": "paragraph"
                },
                {
                  "text": "Весь объём занял четыре рабочих дня. Эта сумма относится к работе на конкретном объекте, без стоимости материалов.",
                  "type": "paragraph"
                },
                {
                  "text": "В готовой ванной видны раковина на новом месте, полотенцесушитель и восстановленные стены. Фотографии процесса помогают понять, сколько работы стоит за этим небольшим изменением.",
                  "type": "paragraph"
                }
              ],
              "heading": "Четыре дня работы и почти целый бигбэг мусора"
            }
          ],
          "category": "История объекта · Ванные",
          "meta_description": "Частичный ремонт ванной в Бадалоне: перенос раковины, установка полотенцесушителя и восстановление стен. Четыре дня и 1100 € за работу с выносом мусора.",
          "seo_title": "Перенос раковины: разобрать и снова собрать ванную",
          "slug": "perenos-rakoviny",
          "summary": "В готовой ванной любое изменение затрагивает больше, чем кажется. Раковину можно снять со стены, но за ней останутся крепления, трубы и вывод под зеркало. А на новом месте всё это нужно подготовить заново.",
          "title": "Перенести раковину — это разобрать и снова собрать ванную"
        }
      }
    },
    {
      "author": "Vital Vibe Construction",
      "body": [
        {
          "blocks": [
            {
              "text": "En la cubierta se ve un captador solar térmico junto a varios paneles fotovoltaicos. Aunque ambos aprovechan el sol, el captador térmico trabaja con un circuito hidráulico que transporta calor hasta el acumulador.",
              "type": "paragraph"
            },
            {
              "alt": "Colector solar térmico instalado sobre una cubierta de teja junto a paneles fotovoltaicos",
              "caption": "El captador solar térmico en la cubierta, junto a los paneles fotovoltaicos.",
              "media_id": "media-solar-collector-roof",
              "type": "image"
            },
            {
              "text": "La sala técnica reúne tuberías, bombas, válvulas, instrumentos y control. Una fotografía exterior no basta para reconstruir todo el circuito: hay que seguir las tuberías y comprobar el esquema y la regulación.",
              "type": "paragraph"
            },
            {
              "alt": "Tuberías, bombas, colectores de distribución y equipos de control en una sala técnica",
              "caption": "Parte de la instalación hidráulica y de control en la sala técnica.",
              "media_id": "media-solar-collector-plant-room",
              "type": "image"
            }
          ],
          "heading": "La instalación real"
        },
        {
          "blocks": [
            {
              "text": "Dos captadores parecidos pueden tener recorridos internos diferentes. Por eso una entrada y una salida situadas en el mismo lado pueden ser correctas para un modelo y no ser la solución prevista para otro.",
              "type": "paragraph"
            },
            {
              "items": [
                "Identificar el modelo exacto del captador.",
                "Consultar el manual de instalación de ese modelo.",
                "Comprobar el número de captadores conectados en la misma fila.",
                "Verificar la posición de entrada, salida, purga y sonda de temperatura."
              ],
              "type": "list"
            }
          ],
          "heading": "La forma exterior no da la respuesta"
        },
        {
          "blocks": [
            {
              "text": "La animación muestra la diferencia geométrica entre una conexión de ida y retorno por el mismo lado y una conexión en lados opuestos. Es una ayuda visual, no el esquema de montaje de un producto concreto.",
              "type": "paragraph"
            },
            {
              "caption": "Esquema interactivo simplificado del recorrido del fluido en un captador solar.",
              "cold_label": "Entrada fría",
              "diagonal_label": "Diagonal",
              "hot_label": "Salida caliente",
              "pause_label": "Pausar flujo",
              "play_label": "Reanudar flujo",
              "same_side_label": "Mismo lado",
              "sensor_label": "S1 · sonda",
              "tank_label": "Acumulador",
              "type": "solar_collector_diagram"
            }
          ],
          "heading": "Compare los dos esquemas"
        },
        {
          "blocks": [
            {
              "text": "Bosch indica que el absorbedor de doble meandro de su gama citada permite conectar en serie hasta cinco captadores por el mismo lado. Buderus declara para el Logasol SKT 1.0-S hasta diez captadores en una fila y conexión de ida y retorno por el mismo lado para filas de hasta cinco. Son ejemplos de modelos concretos, no una regla universal.",
              "type": "paragraph"
            },
            {
              "items": [
                {
                  "label": "Bosch Home Comfort — Excellence 7000 Plus",
                  "url": "https://www.bosch-homecomfort.com/pl/pl/ocs/budynki-mieszkalne/3-x-excellence-7000-plus-1221650-p/"
                },
                {
                  "label": "Buderus — Logasol SKT 1.0-S",
                  "url": "https://www.buderus.com/it/it/ocs/residenziale/collettore-solare-piano-verticale-logasol-skt10-s-757702-p/"
                },
                {
                  "label": "IDAE — Guía Técnica de Energía Solar Térmica",
                  "url": "https://www.idae.es/publicaciones/guia-tecnica-de-energia-solar-termica"
                }
              ],
              "type": "source_list"
            }
          ],
          "heading": "Qué dicen dos fabricantes"
        },
        {
          "blocks": [
            {
              "items": [
                "Leer la placa o etiqueta para confirmar fabricante y modelo.",
                "Comparar el montaje con el esquema hidráulico del manual.",
                "Confirmar dónde debe quedar la sonda del captador y el punto de purga.",
                "Revisar presión, caudal, aislamiento y control con un profesional cualificado."
              ],
              "type": "list"
