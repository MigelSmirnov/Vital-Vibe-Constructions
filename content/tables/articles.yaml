          "heading": "Antes de pintar hay que investigar el estado de la pared"
        },
        {
          "blocks": [
            {
              "text": "Si la pintura existente se desprende en algunas zonas, no se debe aplicar una capa nueva encima. El soporte tendrá que sanearse y, probablemente, volver a enlucirse o masillarse antes de pintar.",
              "type": "paragraph"
            },
            {
              "text": "La pintura no oculta los defectos de la pared: normalmente los hace más visibles.",
              "type": "paragraph"
            },
            {
              "items": [
                "Ondulaciones y desniveles.",
                "Arañazos o golpes.",
