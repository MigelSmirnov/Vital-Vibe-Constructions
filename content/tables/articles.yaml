      "translations": {
        "en": {
          "body": [
            {
              "blocks": [
                {
                  "text": "A low price of €4–6/m² is only possible when the walls are already fully prepared. This is common when we carry out a complete renovation and the surface has already been leveled, repaired, sanded and made ready for the finish.",
                  "type": "paragraph"
                },
                {
                  "text": "In that situation, using a single colour, priming and painting can cost around €6/m². The price includes two coats of paint and the necessary drying time between them.",
                  "type": "paragraph"
                },
                {
                  "text": "These amounts cover labour only, in one colour on already prepared walls. Materials are not included. Crack repairs, removal of peeling paint and other preparation work are priced separately.",
                  "type": "paragraph"
                }
              ],
              "heading": "When painting can cost €4–6/m²"
            },
            {
              "blocks": [
                {
                  "text": "When a client wants to refresh the walls of a home in use, the cost increases because everything that must not be painted first needs protection. Floors, doors, windows, furniture, kitchen units, sockets and switches need covering with cardboard, paper and plastic.",
                  "type": "paragraph"
                },
                {
                  "text": "Depending on the size of the home, the amount of furniture and the complexity of the space, preparation can take from one to several days.",
                  "type": "paragraph"
                }
              ],
              "heading": "Refreshing an occupied home is a different job"
            },
            {
              "blocks": [
                {
                  "text": "A small crack is not always solved with a little filler and paint. It may follow a brickwork joint or appear in a previously repaired area that has opened again.",
                  "type": "paragraph"
                },
                {
                  "text": "That is why it is worth reviewing the cause before covering a defect. In some cases, an apparently minor crack may need a deeper repair to stop it recurring.",
                  "type": "paragraph"
                },
                {
                  "alt": "Fine crack visible in a painted wall",
                  "caption": "Fine crack visible in a painted wall",
                  "media_id": "media-painting-crack",
                  "type": "image"
                }
              ],
              "heading": "Before painting, investigate the condition of the wall"
            },
            {
              "blocks": [
                {
                  "text": "If existing paint is peeling in places, a new coat should not be applied over it. Loose material needs removing, and the substrate may need plastering or filling again before painting.",
                  "type": "paragraph"
                },
                {
                  "text": "Paint does not hide defects in a wall: it usually makes them more visible.",
                  "type": "paragraph"
                },
                {
                  "items": [
                    "Waves and uneven areas.",
                    "Scratches or dents.",
                    "Filler marks.",
                    "Poorly sanded patches.",
                    "Peeling areas in the previous coating."
                  ],
                  "type": "list"
                },
                {
                  "alt": "Loose coating beside a crack, exposing the substrate",
                  "caption": "Loose coating beside a crack, exposing the substrate",
                  "media_id": "media-painting-coating",
                  "type": "image"
                }
              ],
              "heading": "Old paint can fail too"
            },
            {
              "blocks": [
                {
                  "text": "When the old paint is well bonded, shows no peeling and the wall has no significant defects, the process is much simpler: clean the surface, apply a suitable primer and paint.",
                  "type": "paragraph"
                }
              ],
              "heading": "If the existing coating is sound"
            },
            {
              "blocks": [
                {
                  "text": "Paint is normally applied in two coats. The specified drying time is observed between the first and second so the colour is uniform and the finish achieves good durability.",
                  "type": "paragraph"
                },
                {
                  "text": "Both coats and the waiting time between them are included in the quoted square-metre price for already prepared walls.",
                  "type": "paragraph"
