          "blocks": [
            {
              "text": "Un precio bajo, entre 4 y 6 €/m², solo es posible cuando las paredes ya están completamente preparadas. Es una situación habitual cuando realizamos una reforma integral y la superficie ya está nivelada, reparada, lijada y lista para el acabado.",
              "type": "paragraph"
            },
            {
              "text": "En ese caso, con un solo color, la imprimación previa y la aplicación de pintura pueden situarse alrededor de 6 €/m². El precio incluye dos manos de pintura y el tiempo de secado necesario entre ambas.",
              "type": "paragraph"
            },
            {
              "text": "Los importes indicados corresponden solo a la mano de obra, en un color y sobre paredes ya preparadas. Los materiales no están incluidos. La reparación de grietas, la retirada de pintura desprendida y otros trabajos de preparación se presupuestan aparte.",
              "type": "paragraph"
            }
          ],
          "heading": "Cuándo la pintura puede costar entre 4 y 6 €/m²"
        },
        {
          "blocks": [
            {
              "text": "Cuando el cliente quiere renovar las paredes de una vivienda en uso, el coste aumenta porque primero hay que proteger todo lo que no debe pintarse. Suelos, puertas, ventanas, muebles, cocina, enchufes e interruptores deben cubrirse con cartón, papel y plástico.",
              "type": "paragraph"
            },
            {
              "text": "Según el tamaño de la vivienda, la cantidad de mobiliario y la complejidad del espacio, esta preparación puede ocupar desde un día hasta varios días.",
              "type": "paragraph"
            }
          ],
          "heading": "Actualizar una vivienda habitada es otro trabajo"
        },
        {
          "blocks": [
            {
              "text": "Una grieta pequeña no siempre se soluciona con un poco de masilla y pintura. Puede coincidir con una junta de fábrica de ladrillo o aparecer en una zona reparada anteriormente que vuelve a abrirse.",
              "type": "paragraph"
            },
            {
              "text": "Por eso conviene revisar la causa del defecto antes de taparlo. En algunos casos, una grieta aparentemente menor puede requerir una reparación más profunda para evitar que reaparezca.",
              "type": "paragraph"
            },
            {
              "alt": "Grieta fina visible en una pared pintada",
              "caption": "Grieta fina visible en una pared pintada",
              "media_id": "media-painting-crack",
