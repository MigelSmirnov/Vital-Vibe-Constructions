      "id": "article-bathroom-sink-relocation",
      "slug": "traslado-lavabo-toallero",
      "status": "published",
      "language": "es",
      "title": "Mover un lavabo significa desmontar y volver a montar el baño",
      "seo_title": "Mover un lavabo: desmontar y volver a montar el baño",
      "summary": "En un baño terminado, cualquier cambio afecta a más cosas de las que parece. Se puede retirar el lavabo, pero en la pared quedan fijaciones, tuberías y la salida eléctrica del espejo. Y en la nueva ubicación hay que preparar de nuevo todas esas conexiones.",
      "meta_description": "Caso de una reforma parcial de baño: traslado del lavabo, instalaciones y reposición del alicatado. Cuatro días y 1.100 € de mano de obra con retirada de escombros.",
      "category": "Caso de obra · Baños",
      "body": [
        {
          "heading": "El cambio que había que hacer",
          "blocks": [
            {
              "type": "paragraph",
              "text": "En este baño de Badalona, el encargo era trasladar el lavabo a la pared derecha e instalar un toallero en su antigua ubicación."
            },
            {
              "type": "list",
              "items": [
                "Lugar: Badalona.",
                "Cuatro días de trabajo.",
                "1.100 € de mano de obra, incluida la retirada de escombros."
              ]
            }
          ]
        },
        {
          "heading": "Lo que el traslado llevaba consigo",
          "blocks": [
            {
              "type": "paragraph",
              "text": "En la pared anterior quedaban la salida eléctrica del espejo y los orificios de las fijaciones. Al mover el lavabo, esas marcas habrían quedado a la vista: había que recuperar el acabado."
            },
            {
              "type": "paragraph",
              "text": "Además, la salida eléctrica del espejo debía trasladarse a la nueva pared manteniendo la misma altura. Abrir solo la zona cercana a las tuberías no bastaba: hubo que retirar dos filas adicionales de azulejos por encima del lavabo. El traslado de un solo elemento acabó ampliando el trabajo necesario en las paredes."
            },
            {
              "type": "paragraph",
              "text": "También había que adaptar las tomas de agua y el desagüe, reubicar el sensor de fugas y preparar la toma eléctrica del toallero. Cada cambio dependía del siguiente: abrir, trasladar, cerrar y volver a revestir."
            }
          ]
        },
        {
          "heading": "Qué hubo que abrir para mover el lavabo",
          "blocks": [
            {
              "type": "paragraph",
              "text": "Al retirar el alicatado de las zonas afectadas quedaron a la vista el interior del tabique y las instalaciones. Las fotografías de obra muestran esa fase: la pared abierta, las tuberías accesibles y el revestimiento desmontado."
            },
            {
              "type": "image",
              "alt": "Instalaciones de agua y desagüe visibles dentro del tabique abierto del baño",
              "caption": "Traslado de las instalaciones antes de cerrar el tabique.",
              "media_id": "media-bathroom-sink-relocation-open-wall-utilities"
            },
            {
              "type": "paragraph",
              "text": "Aquí se realizó la parte del traslado que después quedaría oculta. Una vez adaptadas las conexiones, se repuso el soporte de yeso laminado. El baño empezó a recuperar su forma, con los puntos de conexión en sus nuevas posiciones."
            },
            {
              "type": "image",
              "alt": "Placas de yeso laminado visibles en la pared derecha del baño durante los trabajos",
              "caption": "Reposición del soporte de la pared antes de recuperar el alicatado.",
              "media_id": "media-bathroom-sink-relocation-wallboard-wide"
            },
            {
              "type": "image",
              "alt": "Pared del baño con placas de yeso laminado y salidas de instalaciones antes del alicatado",
              "caption": "Otro ángulo del soporte preparado y las salidas de instalaciones.",
              "media_id": "media-bathroom-sink-relocation-wallboard-detail"
            }
          ]
        },
        {
          "heading": "Devolver a las paredes su acabado",
          "blocks": [
            {
              "type": "paragraph",
              "text": "Después de adaptar las instalaciones se recuperó el alicatado de las zonas abiertas. Había que resolver las dos partes del encargo: preparar las conexiones en la nueva ubicación y eliminar las huellas de la anterior."
            },
            {
              "type": "image",
              "alt": "Encuentro de las paredes alicatadas del baño, con tomas de agua y salidas eléctricas visibles",
              "caption": "Alicatado repuesto antes de instalar definitivamente los equipos.",
              "media_id": "media-bathroom-sink-relocation-tiling-corner"
            },
            {
              "type": "image",
              "alt": "Pared derecha del baño alicatada con tomas de agua, desagüe y salida para el espejo",
              "caption": "Puntos de conexión en la pared derecha después de recuperar el revestimiento.",
              "media_id": "media-bathroom-sink-relocation-tiling-wall"
            },
            {
              "type": "paragraph",
              "text": "En estas fotografías ya se ven las paredes revestidas y las salidas preparadas. Faltaba el montaje definitivo. El lavabo quedó en la pared derecha y el toallero ocupó su antigua pared."
            },
            {
              "type": "image",
              "alt": "Baño con ducha de cristal, lavabo suspendido y espejo iluminado",
              "caption": "Resultado de la intervención. Imagen de portada retocada previamente con IA; las fotografías de obra se conservan sin retoque.",
              "media_id": "media-home-bathroom"
            }
          ]
        },
        {
          "heading": "Cuatro días de trabajo y casi un big bag de escombros",
          "blocks": [
            {
              "type": "paragraph",
              "text": "Incluso una intervención localizada como esta generó casi un big bag de escombros. Su retirada quedó incluida en los 1.100 € de mano de obra."
            },
            {
              "type": "paragraph",
              "text": "El trabajo completo duró cuatro días. Esta cifra corresponde a la mano de obra de este encargo, sin el coste de los materiales."
            },
            {
              "type": "paragraph",
              "text": "En el baño terminado se ven el lavabo en su nuevo lugar, el toallero y las paredes recuperadas. Las fotografías del proceso ayudan a entender el trabajo que hubo detrás de ese pequeño cambio."
            }
          ]
        }
      ],
