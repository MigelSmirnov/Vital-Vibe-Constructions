            },
            {
              "type": "paragraph",
              "text": "La sala técnica reúne tuberías, bombas, válvulas, instrumentos y control. Una fotografía exterior no basta para reconstruir todo el circuito: hay que seguir las tuberías y comprobar el esquema y la regulación."
            },
