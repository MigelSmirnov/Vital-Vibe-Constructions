              "type": "paragraph"
            },
            {
              "text": "A veces se puede reducir el presupuesto sin una pérdida importante de calidad.",
              "type": "paragraph"
            },
            {
              "text": "Por ejemplo, si los desniveles son mínimos, se puede escoger una solución más sencilla adaptada al pavimento.",
              "type": "paragraph"
            },
            {
              "text": "En espacios de poco uso, a veces puede utilizarse un laminado económico.",
              "type": "paragraph"
            },
            {
              "text": "Sin embargo, en muchos casos recomendamos considerar los pavimentos de PVC actuales.",
              "type": "paragraph"
            },
            {
              "text": "Aunque el material en sí sea más caro, la diferencia en el coste total de la reforma resulta mucho menor de lo que muchos esperan. Además, el PVC soporta mejor el uso cotidiano y dura bastante más.",
              "type": "paragraph"
            }
          ],
          "heading": "Dónde se puede ahorrar de verdad"
        },
        {
          "blocks": [
            {
              "text": "El coste de reformar un piso en Barcelona no depende solo de su superficie.",
              "type": "paragraph"
            },
            {
              "text": "Influyen el estado del inmueble, la calidad de la base, las instalaciones y las particularidades de los edificios antiguos.",
              "type": "paragraph"
            },
            {
              "text": "Por eso nunca damos un precio definitivo solo por teléfono.",
              "type": "paragraph"
            },
            {
              "text": "Valoramos más que lo que se ve en una primera visita.",
              "type": "paragraph"
            },
            {
              "text": "Valoramos la base sobre la que se apoyará toda la futura reforma.",
              "type": "paragraph"
            },
            {
              "text": "Solo entonces se puede preparar un presupuesto lo más preciso posible y evitar sorpresas desagradables durante los trabajos.",
              "type": "paragraph"
            }
          ],
          "heading": "Conclusión"
        }
